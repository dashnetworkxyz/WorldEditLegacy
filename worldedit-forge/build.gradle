import dev.architectury.pack200.java.Pack200Adapter

plugins {
    id 'com.igormaznitsa.jcp'
    id 'gg.essential.loom' version '1.15.50'
    id 'dev.architectury.architectury-pack200' version '0.1.3'
}

final def versions = [
        '1.8.9': [ compare: 10809, mappings: '22-1.8.9', forge: '1.8.9-11.15.1.2318-1.8.9' ],
        '1.9.4': [ compare: 10904, mappings: '26-1.9.4', forge: '1.9.4-12.17.0.1965' ],
        '1.10.2': [ compare: 11002, mappings: '29-1.10.2', forge: '1.10.2-12.18.0.2002-1.10.0' ],
        '1.11.2': [ compare: 11102, mappings: '32-1.11', forge: '1.11.2-13.20.1.2386' ],
        '1.12.2': [ compare: 11202, mappings: '39-1.12', forge: '1.12.2-14.23.5.2768' ]
]
String minecraftVersion = project.properties['mcVer'] ?: '1.12.2'

if (!versions.containsKey(minecraftVersion)) {
    throw new GradleException("Minecraft $minecraftVersion is not supported.")
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.spongepowered.org/maven' }
}

dependencies {
    implementation project(':worldedit-core')
    implementation 'org.spongepowered:spongeapi:7.4.0-SNAPSHOT'
    testImplementation 'org.mockito:mockito-core:1.9.0-rc1'

    minecraft "com.mojang:minecraft:$minecraftVersion"
    mappings "de.oceanlabs.mcp:mcp_stable:${versions[minecraftVersion].mappings}"
    forge "net.minecraftforge:forge:${versions[minecraftVersion].forge}"
}

final File transformerFile = file 'src/main/resources/worldedit_at.cfg'

loom {
    forge {
        pack200Provider.set(Pack200Adapter.getDeclaredConstructor().newInstance())

        if (transformerFile.exists()) {
            println('Installing access transformer')
            accessTransformer(transformerFile)
        }
    }
}

processResources {
    filesMatching('mcmod.info') {
        expand(
                internalVersion: version,
                mcVersion: minecraftVersion,
                forgeVersion: versions[minecraftVersion].forge
        )
    }
}

preprocess {
    outputs.upToDateWhen { target.get().exists() } // https://github.com/raydac/java-comment-preprocessor/issues/42

    sources = sourceSets.main.java.srcDirs
    keepLines = false
    fileExtensions = ['java']
    actionPreprocessorExtensions = ["com.igormaznitsa.jcp.extension.LogPreprocessorExtension"]
    vars = ['MC': versions[minecraftVersion].compare]
}

tasks.register('changeSourceFolder') {
    dependsOn tasks.named('preprocess')
    doLast {
        sourceSets.main.java.srcDirs = [preprocess.target]
    }
}

tasks.withType(Jar).configureEach {
    archiveBaseName.set("worldedit-forge-$minecraftVersion")
    manifest.attributes['FMLCorePluginContainsFMLMod'] = 'true'
    manifest.attributes['ForceLoadAsMod'] = 'true'

    if (transformerFile.exists()) {
        manifest.attributes['FMLAT'] = 'worldedit_at.cfg'
    }
}

remapJar {
    archiveBaseName.set("worldedit-forge-$minecraftVersion")
    archiveClassifier.set('dist')
    inputFile.set(tasks.shadowJar.archiveFile)
}

shadowJar {
    dependencies {
        include(dependency(':worldedit-core'))
    }

    archiveClassifier.set('non-obfuscated')
}

compileJava.dependsOn changeSourceFolder
assemble.dependsOn remapJar