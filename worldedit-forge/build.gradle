buildscript {
    repositories {
        mavenCentral()
        maven { url = "https://maven.architectury.dev" }
        maven { url = "https://maven.fabricmc.net" }
        maven { url = "https://maven.minecraftforge.net" }
        maven { url = "https://repo.essential.gg/public" }
    }

    dependencies {
        classpath 'gg.essential.loom:gg.essential.loom.gradle.plugin:1.15.50'
        classpath 'dev.architectury:architectury-pack200:0.1.3'
    }
}

apply plugin: 'gg.essential.loom'
apply plugin: 'dev.architectury.architectury-pack200'

loom.noServerRunConfigs()
