plugins {
    id 'eclipse'
    id 'idea'
}

repositories {
    maven { url = 'https://hub.spigotmc.org/nexus/content/groups/public' }
}

dependencies {
    implementation project(':worldedit-core')
    implementation 'com.sk89q:dummypermscompat:1.8'
    implementation 'org.bukkit:bukkit:1.9.4-R0.1-SNAPSHOT' // zzz
    testImplementation 'org.mockito:mockito-core:1.9.0-rc1'
}

processResources {
    from (sourceSets.main.resources.srcDirs) {
        expand 'internalVersion': rootProject.internalVersion
        include 'plugin.yml'
    }

    from (sourceSets.main.resources.srcDirs) {
        exclude 'plugin.yml'
    }
}

jar {
    manifest {
        attributes("Class-Path": "truezip.jar WorldEdit/truezip.jar js.jar WorldEdit/js.jar",
                   "WorldEdit-Version": version)
    }
}

shadowJar {
    dependencies {
        include(dependency(':worldedit-core'))
        include(dependency('com.google.code.gson:gson:2.2.4'))
    }

    relocate('com.google.gson', 'com.sk89q.worldedit.internal.gson')
}

tasks.build.dependsOn(tasks.shadowJar)
