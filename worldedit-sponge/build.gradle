import org.spongepowered.gradle.plugin.config.PluginLoaders
import org.spongepowered.plugin.metadata.model.PluginDependency

buildscript {
    repositories {
        mavenCentral()
        maven { url = 'https://repo.spongepowered.org/repository/maven-public' }
        maven { url = 'https://maven.minecraftforge.net' }
    }

    dependencies {
        classpath 'org.spongepowered.gradle.plugin:org.spongepowered.gradle.plugin.gradle.plugin:2.3.0'
    }
}

apply plugin: 'org.spongepowered.gradle.plugin'

dependencies {
    implementation project(':worldedit-core')
    implementation 'org.spongepowered:spongeapi:7.0.0-SNAPSHOT'
    testImplementation "org.mockito:mockito-core:1.9.0-rc1"
}

sponge {
    apiVersion('7.4.0')
    license('GPL-v3.0')
    loader {
        name(PluginLoaders.JAVA_PLAIN)
        version('1.0')
    }
    plugin('worldedit') {
        entrypoint('com.sk89q.worldedit.sponge.SpongeWorldEdit')
        displayName('WorldEdit')
        version(version)
        description("WorldEdit is an easy-to-use in-game world editor for Minecraft")
        dependency("spongeapi") {
            loadOrder(PluginDependency.LoadOrder.AFTER)
            optional(false)
        }
    }
}

jar {
    manifest {
        attributes(
                "Class-Path": "truezip.jar WorldEdit/truezip.jar js.jar WorldEdit/js.jar",
                "WorldEdit-Version": version
        )
    }

    archiveVersion.set(version.toString())
}

shadowJar {
    dependencies {
        include(dependency(':worldedit-core'))
    }

    archiveVersion.set(version.toString())
}

artifacts {
    archives shadowJar
}