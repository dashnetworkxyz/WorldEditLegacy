import org.ajoberstar.grgit.Grgit

plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.4.1'
    id 'org.ajoberstar.grgit' version '5.3.3'
}

println """
*******************************************
 You are building WorldEdit!

 If you encounter trouble:
 1) Read COMPILING.md if you haven't yet
 2) Try running 'build' in a separate Gradle run
 3) Use gradlew and not gradle

 Output files will be in [subproject]/build/libs
*******************************************
"""

allprojects {
    group = 'com.sk89q.worldedit'
    version = '6.1.9-SNAPSHOT'
}

if (!project.hasProperty("gitCommitHash")) {
    def repo = Grgit.open(dir: project.projectDir)

    try {
        project.extensions.extraProperties.set('gitCommitHash', repo.head().abbreviatedId)
    } catch (Exception e) {
        println "Error getting commit hash: " + e.getMessage()
    } finally {
        repo.close()
    }
}

if (!project.hasProperty("gitCommitHash")) {
    project.extensions.extraProperties.set('gitCommitHash', 'no_git_id')
}

project.extensions.extraProperties.set('internalVersion', "${project.version};${gitCommitHash}")

subprojects {
    apply plugin: 'java'
    apply plugin: 'com.gradleup.shadow'

    java {
        sourceCompatibility = 1.8
        targetCompatibility = 1.8
    }

    repositories {
        mavenCentral()
        maven { url 'https://maven.enginehub.org/artifactory/ext-release-local' }
        maven { url 'https://maven.enginehub.org/artifactory/libs-release-local' }
    }

    tasks.withType(Javadoc).configureEach {
        options.addStringsOption('Xdoclint:none', '-quiet')
    }

    tasks.register('javadocJar', Jar) {
        archiveClassifier.set('javadoc')
        from javadoc.destinationDir
    }

    tasks.withType(Copy).configureEach {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }

    artifacts {
        archives jar
        archives javadocJar
    }

    if (!(name.equals('worldedit-forge') || name.equals('worldedit-sponge'))) {
        tasks.register('sourcesJar', Jar) {
            archiveClassifier.set('sources')
            from sourceSets.main.allSource

            duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        }

        artifacts {
            archives sourcesJar
        }

        build.dependsOn(sourcesJar)
    }

    build.dependsOn(javadocJar)

    shadowJar {
        archiveClassifier.set('dist')

        dependencies {
            include(dependency('com.sk89q:jchronic:0.2.4a'))
            include(dependency('com.thoughtworks.paranamer:paranamer:2.6'))
            include(dependency('com.sk89q.lib:jlibnoise:1.0.0'))
        }

        exclude 'GradleStart**'
        exclude '.cache'
        exclude 'LICENSE*'
    }
}