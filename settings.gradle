pluginManagement {
    repositories {
        mavenCentral()
        maven {
            name = 'Forge'
            url = uri 'https://maven.minecraftforge.net'
        }
        maven {
            name = 'Fabric'
            url = uri 'https://maven.fabricmc.net'
        }
        maven {
            name = 'Architectury'
            url = uri 'https://maven.architectury.dev'
        }
        maven {
            name = 'Essential'
            url = uri 'https://repo.essential.gg/public'
        }
        maven {
            name = 'SpongePowered'
            url = uri 'https://repo.spongepowered.org/repository/maven-public'
        }
    }
}

buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'com.igormaznitsa:jcp:7.3.0'
    }
}

rootProject.name = 'worldedit'

include 'worldedit-core'
include 'worldedit-bukkit'
include 'worldedit-forge'
include 'worldedit-sponge'
//include 'worldedit-fabric'